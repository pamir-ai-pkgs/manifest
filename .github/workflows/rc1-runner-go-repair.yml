name: RC1 runner Go dependency repair

on:
  workflow_dispatch:
  push:
    branches: [codex/rc1-runner-go-20261029]

permissions:
  contents: read

concurrency:
  group: rk3576-bsp-release
  cancel-in-progress: false

jobs:
  repair:
    runs-on: [self-hosted, linux, x64, rk3576, bsp]
    timeout-minutes: 20
    steps:
      - name: Inspect existing Go dependency
        shell: bash
        run: |
          set -euo pipefail
          type -a go
          go version
          go env GOVERSION GOROOT GOTOOLCHAIN
          printf 'Inherited GOROOT: %s\n' "${GOROOT:-unset}"
          for tool in go gofmt; do
            if [ -e "/usr/local/bin/$tool" ] || [ -L "/usr/local/bin/$tool" ]; then
              ls -ld "/usr/local/bin/$tool"
            fi
          done

      - name: Install the frozen source's required Go version
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false

      - name: Select the verified toolchain while preserving previous executables
        shell: bash
        run: |
          set -euo pipefail
          toolroot=$(go env GOROOT)
          [ "$(env -u GOROOT GOTOOLCHAIN=local "$toolroot/bin/go" env GOVERSION)" = go1.26.10 ]
          repair_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          backup="/srv/bsp/runner-repairs/rc1-go-$repair_id"
          sudo install -d -m 0700 "$backup"
          for tool in go gofmt; do
            target="/usr/local/bin/$tool"
            [ ! -d "$target" ] || { echo "Refusing to replace directory $target" >&2; exit 1; }
            if [ -e "$target" ] || [ -L "$target" ]; then
              sudo cp -a --no-dereference -- "$target" "$backup/$tool"
            fi
            sudo ln -s "$toolroot/bin/$tool" "/usr/local/bin/.$tool-rc1-$repair_id"
            sudo mv -Tf "/usr/local/bin/.$tool-rc1-$repair_id" "$target"
          done
          printf 'Prior executables retained at %s; original toolchain directories untouched\n' "$backup"
          # The BSP driver prepends this system PATH. Test that path rather
          # than setup-go's per-job PATH, including Debian packaging's clean env.
          host_path=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          env -u GOROOT GOTOOLCHAIN=local PATH="$host_path" bash -euc '
            command -v go
            go version
            [ "$(go env GOVERSION)" = go1.26.10 ]
          '
          probe=$(mktemp -d "$RUNNER_TEMP/rc1-go-probe.XXXXXX")
          printf 'module runnerprobe\n\ngo 1.26.10\n' > "$probe/go.mod"
          printf 'package main\nfunc main() {}\n' > "$probe/main.go"
          (
            cd "$probe"
            env -u GOROOT GOTOOLCHAIN=local PATH="$host_path" \
              CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o probe .
            file probe
          )
          echo 'Pinned Go1.26.10 host dependency and ARM64 compilation verified; no BSP source or cache modified.'
