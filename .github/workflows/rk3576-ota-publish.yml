name: Inspect runner old image storage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rk3576-bsp-release
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, rk3576, bsp]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Inventory generated images and active workspace users
        run: sudo python3 recovery/production/disk.py "$RUNNER_TEMP/production-disk-$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-disk-inventory
          path: ${{ runner.temp }}/production-disk-*/
