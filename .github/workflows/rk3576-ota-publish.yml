name: Verify existing DVT production artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rk3576-bsp-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, linux, x64, rk3576, bsp]
    timeout-minutes: 30
    env:
      SDK_DIR: /srv/bsp/workspaces/v020-dvt-prod-ci-38984242768-2
      BUILD_ID: 38984242768-2
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Verify original production payload without rebuilding or modifying it
        run: sudo --preserve-env=SDK_DIR,BUILD_ID,GITHUB_RUN_ID python3 recovery/production/verify.py "$RUNNER_TEMP/production-verify-$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v020-production-verification
          path: ${{ runner.temp }}/production-verify-*/
