name: Clean approved obsolete raw image intermediates
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rk3576-bsp-release
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, rk3576, bsp]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Delete only selected inactive old image intermediates
        run: sudo python3 recovery/production/cleanup.py "$RUNNER_TEMP/production-disk-$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-image-cleanup-receipt
          path: ${{ runner.temp }}/production-disk-*/
