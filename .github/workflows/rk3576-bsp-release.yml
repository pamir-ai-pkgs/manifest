name: Build v0.2.0 DVT production only
on:
  workflow_dispatch:
    inputs:
      publish_ota:
        description: Must remain false; this build has no OTA publishing steps
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: rk3576-bsp-release
  cancel-in-progress: false
jobs:
  build:
    name: Build DVT production image and signed bundle
    runs-on: [self-hosted, linux, x64, rk3576, bsp]
    timeout-minutes: 1440
    env:
      AWS_REGION: us-west-2
      AWS_DEFAULT_REGION: us-west-2
      ARTIFACT_DOWNLOAD_BASE_URL: https://d16xxnueu5edhn.cloudfront.net
      ARTIFACT_DOWNLOAD_TOKEN: ${{ secrets.PAMIR_ARTIFACT_DOWNLOAD_TOKEN }}
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      BOARD_VARIANT: dvt
      DEFCONFIG: rockchip_rk3576_lapis_dvt_secure_defconfig
      MANIFEST_FILE: rk3576-debian-ab.xml
      MANIFEST_URL: https://github.com/pamir-ai-pkgs/manifest
      MANIFEST_REF: refs/tags/rk3576-v0.2.0
      CHANNEL: stable
      VERSION: rk3576-v0.2.0
      RK_IMAGE_VERSION: v0.2.0
      RAUC_BUNDLE: '1'
      RELEASE_IMAGE_LABEL: DVT-Secure
      STABLE_POINTER_NAME: dvt-sec-latest.json
      CHANNEL_POINTER_NAME: dvt-sec-latest.json
      MIN_FREE_GIB: '75'
      PRE_COMMIT_HOME: /srv/bsp/pre-commit-cache
      REPO_MIRROR: /srv/bsp/repo-mirror
      S3_BUCKET: lapis-os-artifacts
      UV_CACHE_DIR: /srv/bsp/uv-cache
      WORK_ROOT: /srv/bsp/workspaces
      XDG_CACHE_HOME: /srv/bsp/cache
    steps:
      - name: Checkout manifest repo
        uses: actions/checkout@v6.0.3
        with:
          path: manifest-checkout

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false

      - name: Install repo tool
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          if ! command -v repo >/dev/null 2>&1; then
            curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
              -o "$HOME/.local/bin/repo"
            chmod 0755 "$HOME/.local/bin/repo"
          fi
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Configure GitHub authentication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAMIR_GITHUB_TOKEN }}
        run: |
          # A runner crash can skip cleanup and leave all three rewrite values.
          git config --global --replace-all \
            url."https://x-access-token:${GH_TOKEN}@github.com/pamir-ai-pkgs/".insteadOf \
            "https://github.com/pamir-ai-pkgs/"
          # Cargo git dependencies may be declared with SSH URLs; the runner
          # has no deploy key, so fold those onto the same token rewrite.
          # Both forms live in one url.<token> section, which the
          # "Remove ephemeral GitHub token rewrite" step drops wholesale.
          git config --global --add \
            url."https://x-access-token:${GH_TOKEN}@github.com/pamir-ai-pkgs/".insteadOf \
            "ssh://git@github.com/pamir-ai-pkgs/"
          git config --global --add \
            url."https://x-access-token:${GH_TOKEN}@github.com/pamir-ai-pkgs/".insteadOf \
            "git@github.com:pamir-ai-pkgs/"
          gh auth status

      - name: Require production-only scope and original tag
        env:
          GH_TOKEN: ${{ secrets.PAMIR_GITHUB_TOKEN }}
          PUBLISH_OTA: ${{ inputs.publish_ota }}
          RK_LAPIS_USER_PASSWORD: ${{ secrets.PAMIR_LAPIS_USER_PASSWORD }}
          LAPIS_CF_ACCESS_SIT: ${{ secrets.PAMIR_LAPIS_CF_ACCESS_SIT }}
        run: |
          test "$PUBLISH_OTA" = false
          test -n "$RK_LAPIS_USER_PASSWORD"
          test -n "$LAPIS_CF_ACCESS_SIT"
          test "$(gh api repos/pamir-ai-pkgs/manifest/git/ref/tags/rk3576-v0.2.0 --jq .object.sha)" = 04008b8b8b181323bdc9da3792bd029c0c013a34
          {
            echo "BUILD_ID=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "SDK_DIR=$WORK_ROOT/v020-dvt-prod-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "S3_PREFIX=s3://$S3_BUCKET/pamir-rk3576/releases/rk3576-v0.2.0-dvt-sec/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"

      - name: Bootstrap BSP tools
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAMIR_GITHUB_TOKEN }}
        run: |
          mkdir -p "$UV_CACHE_DIR" "$XDG_CACHE_HOME" "$PRE_COMMIT_HOME" "$REPO_MIRROR"
          python3 --version
          manifest-checkout/ci/bootstrap-workspace.sh "$SDK_DIR"

      - name: Converge runner build deps
        shell: bash
        run: |
          # bsp-tools owns the runner dependency list; converge the host to
          # it so a dep added on main (e.g. rauc for bundle builds) cannot
          # outrun the runner AMI. Idempotent once installed.
          sudo WORK_ROOT=/srv/bsp "$SDK_DIR/bsp-tools/ci/bootstrap-debian-runner.sh"

      - name: Runner preflight
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAMIR_GITHUB_TOKEN }}
        run: |
          cd "$SDK_DIR"
          bsp-tools/ci/preflight-runner.sh

      - name: Provision FIT boot-chain signing keys
        shell: bash
        env:
          BOOT_KEYS_TGZ_B64: ${{ secrets.PAMIR_BOOT_KEYS_TGZ_B64 }}
          OTP_PUBKEY_SHA256: ${{ vars.PAMIR_OTP_PUBKEY_SHA256 }}
        run: |
          # RK_SECURE_BOOT=y signs the loader and both FIT keyrings from
          # u-boot/keys/. These MUST be the canonical fielded keys: the OTP
          # hash and the keyrings baked into fielded SPL/U-Boot only verify
          # images signed by them, so regenerating keys in CI (or silently
          # picking up stale keys left on the persistent runner workspace)
          # ships an unbootable or bricking OTA. Wipe the keys dir and
          # materialize the set from the secret; the AVB step below re-adds
          # avb_vbmeta.pem, so this step must stay ordered before it.
          if [ -z "${BOOT_KEYS_TGZ_B64:-}" ]; then
            echo "::error::PAMIR_BOOT_KEYS_TGZ_B64 secret is not set" >&2
            exit 1
          fi
          if [ -z "${OTP_PUBKEY_SHA256:-}" ]; then
            echo "::error::PAMIR_OTP_PUBKEY_SHA256 variable is not set" >&2
            exit 1
          fi
          keys_dir="$SDK_DIR/u-boot/keys"
          rm -rf "$keys_dir"
          install -d -m 0700 "$keys_dir"
          ( umask 077
            printf '%s' "$BOOT_KEYS_TGZ_B64" | base64 -d \
              | tar -xzf - -C "$keys_dir" )
          missing=0
          for f in dev.key dev.pubkey dev.crt root.key root.pubkey root.crt \
              ub-v1.key kernel-v1.key \
              ub-v1.crt ub-v2.crt ub-v3.crt ub-v4.crt ub-v5.crt \
              ub-v1.pubkey ub-v2.pubkey ub-v3.pubkey ub-v4.pubkey \
              ub-v5.pubkey \
              kernel-v1.crt kernel-v2.crt kernel-v3.crt kernel-v4.crt \
              kernel-v5.crt \
              kernel-v1.pubkey kernel-v2.pubkey kernel-v3.pubkey \
              kernel-v4.pubkey kernel-v5.pubkey; do
            if [ ! -s "$keys_dir/$f" ]; then
              echo "::error::boot key set is missing $f" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { rm -rf "$keys_dir"; exit 1; }
          for k in dev root ub-v1 kernel-v1; do
            if ! openssl rsa -in "$keys_dir/$k.key" -check -noout \
                >/dev/null 2>&1; then
              echo "::error::$k.key is not a valid RSA private key" >&2
              rm -rf "$keys_dir"
              exit 1
            fi
          done
          # security-createkeys names the rk_sign_tool output
          # private_key.pem/public_key.pem and symlinks dev.* onto it;
          # symlinks don't survive the tarball, so recreate the aliases.
          ln -rsf "$keys_dir/dev.key" "$keys_dir/private_key.pem"
          ln -rsf "$keys_dir/dev.pubkey" "$keys_dir/public_key.pem"
          # Brick guard: dev.pubkey must be the OTP-bound key; a mismatch
          # means fielded BootROM/SPL cannot verify what we sign.
          got="$(sha256sum "$keys_dir/dev.pubkey" | cut -d' ' -f1)"
          if [ "$got" != "$OTP_PUBKEY_SHA256" ]; then
            echo "::error::dev.pubkey sha256 $got does not match" \
              "PAMIR_OTP_PUBKEY_SHA256 — refusing to sign with a key the" \
              "fielded OTP anchor cannot verify" >&2
            rm -rf "$keys_dir"
            exit 1
          fi
          echo "FIT boot-chain signing keys provisioned at u-boot/keys/" \
            "(dev.pubkey verified against OTP anchor hash)"

      - name: Provision AVB vbmeta signing key
        shell: bash
        env:
          AVB_VBMETA_KEY_B64: ${{ secrets.PAMIR_AVB_VBMETA_KEY_B64 }}
        run: |
          # RK_PAMIR_AVB_VERITY=y / CONFIG_PAMIR_AVB_ENFORCE=y require the
          # RSA-4096 vbmeta key at build time: U-Boot pins its public key and
          # the mkosi stage signs per-slot vbmeta. The key is never committed
          # (u-boot/keys/ is gitignored), so materialize it from the secret
          # after sync and before the build, into the path both consumers read.
          if [ -z "${AVB_VBMETA_KEY_B64:-}" ]; then
            echo "::error::PAMIR_AVB_VBMETA_KEY_B64 secret is not set" >&2
            exit 1
          fi
          install -d -m 0700 "$SDK_DIR/u-boot/keys"
          ( umask 077
            printf '%s' "$AVB_VBMETA_KEY_B64" | base64 -d \
              > "$SDK_DIR/u-boot/keys/avb_vbmeta.pem" )
          if ! head -1 "$SDK_DIR/u-boot/keys/avb_vbmeta.pem" \
              | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "::error::decoded AVB key is not a PEM private key" >&2
            rm -f "$SDK_DIR/u-boot/keys/avb_vbmeta.pem"
            exit 1
          fi
          echo "AVB vbmeta signing key provisioned at u-boot/keys/avb_vbmeta.pem"

      - name: Build only production from unchanged frozen components
        env:
          GH_TOKEN: ${{ secrets.PAMIR_GITHUB_TOKEN }}
          RK_LAPIS_USER_PASSWORD: ${{ secrets.PAMIR_LAPIS_USER_PASSWORD }}
          LAPIS_CF_ACCESS_SIT: ${{ secrets.PAMIR_LAPIS_CF_ACCESS_SIT }}
        run: |
          cfdir=$(mktemp -d -p /dev/shm)
          trap 'rm -rf "$cfdir"' EXIT
          chmod 0700 "$cfdir"
          (umask 077; printf '%s' "$LAPIS_CF_ACCESS_SIT" > "$cfdir/cf-access.json")
          export RK_LAPIS_CF_ACCESS_FILE="$cfdir/cf-access.json"
          export PRODUCTION_ORCHESTRATION="$GITHUB_WORKSPACE/manifest-checkout/recovery/production"
          python3 "$PRODUCTION_ORCHESTRATION/build.py"

      - name: Verify production rootfs and signed bundle
        env:
          GH_TOKEN: ${{ secrets.PAMIR_GITHUB_TOKEN }}
        run: |
          sudo --preserve-env=SDK_DIR,BUILD_ID,RUNNER_TEMP,GITHUB_RUN_ID python3 manifest-checkout/recovery/production/verify.py "$RUNNER_TEMP/v020-prod-$GITHUB_RUN_ID"

      - name: Upload production build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v020-dvt-production-evidence
          path: |
            ${{ runner.temp }}/v020-prod-*/
            ${{ env.SDK_DIR }}/output/releases/ci/${{ env.BUILD_ID }}/*.json
            ${{ env.SDK_DIR }}/output/releases/ci/${{ env.BUILD_ID }}/SHA256SUMS
          if-no-files-found: warn

      - name: Remove ephemeral GitHub token rewrite
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAMIR_GITHUB_TOKEN }}
        run: |
          git config --global --remove-section \
            "url.https://x-access-token:${GH_TOKEN}@github.com/pamir-ai-pkgs/" || true

      - name: Wipe provisioned signing keys
        if: always()
        shell: bash
        run: |
          rm -rf "${SDK_DIR:-/nonexistent}/u-boot/keys" || true
