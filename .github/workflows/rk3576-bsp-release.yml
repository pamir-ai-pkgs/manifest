name: RK3576 BSP Release

on:
  push:
    tags:
      - rk3576-v*
  workflow_dispatch:
    inputs:
      publish_dvt_rc2_dev:
        description: Publish the verified DVT rc.2 bundle to shared lapis/dev.
        type: boolean
        default: false
      verify_artifacts:
        description: Verify retained rc.2 images read-only.
        type: boolean
        default: false
      repair_subids:
        description: Extend the verified runner subordinate ID allocation by one.
        type: boolean
        default: false
      diagnose_runner:
        description: Inspect runner user namespace mappings without building.
        type: boolean
        default: false
      manifest_ref:
        description: Manifest branch, tag, or ref to build.
        required: true
        default: main
      channel:
        description: Artifact channel.
        required: true
        type: choice
        default: scratch
        options:
          - scratch
          - dev
          - candidate
          - stable
          - nightly
      version:
        description: Release tag. Candidate/stable/nightly dispatch must build the matching rk3576-v* tag.
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: rk3576-bsp-release
  cancel-in-progress: false

jobs:
  diagnose:
    if: inputs.diagnose_runner == true && inputs.publish_dvt_rc2_dev != true
    runs-on: [self-hosted, linux, x64, rk3576, bsp]
    timeout-minutes: 20
    steps:
      - name: Extend subordinate ID allocation
        if: inputs.repair_subids == true
        shell: bash
        run: |
          sudo python3 - <<'PYREPAIR'
          from pathlib import Path
          import os, shutil, tempfile, time
          paths = [Path('/etc/subuid'), Path('/etc/subgid')]
          plans = []
          for path in paths:
              rows = [line.split(':') for line in path.read_text().splitlines() if line and not line.startswith('#')]
              own = [row for row in rows if row[0] in ('admin', '1000')]
              if len(own) != 1 or own[0][0] != 'admin' or int(own[0][1]) != 100000:
                  raise SystemExit(f'Unexpected admin allocation in {path}; no changes made')
              count = int(own[0][2])
              if count not in (65536, 65537):
                  raise SystemExit(f'Unexpected allocation size in {path}; no changes made')
              for name, start, size in rows:
                  if name not in ('admin', '1000') and int(start) <= 165536 < int(start) + int(size):
                      raise SystemExit(f'New ID overlaps {name} in {path}; no changes made')
              if count == 65536:
                  plans.append((path, path.read_text()))
          if plans:
              stamp = str(time.time_ns())
              for path in paths:
                  shutil.copy2(path, str(path) + '.rc2-backup-' + stamp)
              # usermod refuses to edit an active runner account. Only replace
              # its subordinate-ID count; keep its UID, GID and other rows intact.
              for path, before in plans:
                  if path.read_text() != before:
                      raise SystemExit(f'{path} changed during repair')
                  lines = before.splitlines(keepends=True)
                  after = ''.join('admin:100000:65537\n' if line.rstrip('\n') == 'admin:100000:65536' else line for line in lines)
                  if after == before:
                      raise SystemExit(f'Expected exact allocation absent in {path}')
                  fd, name = tempfile.mkstemp(dir=path.parent, prefix=path.name+'.rc2-')
                  with os.fdopen(fd, 'w') as stream:
                      stream.write(after)
                      stream.flush()
                      os.fsync(stream.fileno())
                  shutil.copystat(path, name)
                  os.chown(name, path.stat().st_uid, path.stat().st_gid)
                  os.replace(name, path)
          PYREPAIR
      - name: Inspect user namespace mappings
        shell: bash
        run: |
          id
          unshare --version
          printf 'Configured subordinate IDs:\n'
          awk -F: -v user="$(id -un)" -v uid="$(id -u)" '$1 == user || $1 == uid {print FILENAME ":" $0}' /etc/subuid /etc/subgid
          printf 'Actual auto/root mappings:\n'
          unshare --map-auto --map-root-user sh -c 'cat /proc/self/uid_map; cat /proc/self/gid_map'
          printf 'Subordinate ID helper permissions:\n'
          ls -l /usr/bin/newuidmap /usr/bin/newgidmap
          unshare --map-auto --map-root-user awk '
            FILENAME ~ /uid_map/ && $1 == 1 && $3 >= 65536 { uid = 1 }
            FILENAME ~ /gid_map/ && $1 == 1 && $3 >= 65536 { gid = 1 }
            END { exit !(uid && gid) }
          ' /proc/self/uid_map /proc/self/gid_map
      - name: Verify retained rc.2 artifacts
        if: inputs.verify_artifacts == true
        shell: bash
        run: |
          export PATH="$PATH:/usr/sbin:/sbin"
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import hashlib,io,json,subprocess,tarfile,tempfile
          BASE=Path('/srv/bsp/workspaces')
          EXPECTED_SOURCE='122609bbbd87b191836bcddc3d767669690f2f7b'
          def sha(path):
           h=hashlib.sha256()
           with path.open('rb') as f:
            for block in iter(lambda:f.read(8*1024*1024),b''): h.update(block)
           return h.hexdigest()
          for name,channel,version,closure in [
           ('pamir-rk3576-candidate','dev','2026.10.4','6wx388j6cy5m0d6sqa0in11fx908kn47-lapis-env'),
           ('pamir-rk3576-secure','sit','2026.9.15','fss8vha6n2nb357mddyvqvdpkwx2gsg0-lapis-env'),
           ('pamir-rk3576-dvt-candidate','dev','2026.10.4','6wx388j6cy5m0d6sqa0in11fx908kn47-lapis-env'),
           ('pamir-rk3576-dvt-secure','sit','2026.9.15','fss8vha6n2nb357mddyvqvdpkwx2gsg0-lapis-env')]:
           sdk=BASE/name; release=sdk/'output/releases/ci/37172720465-2'; rootfs=sdk/'mkosi/lapis-rootfs.img'
           assert rootfs.is_file(),str(rootfs)
           def read(path):
            return subprocess.check_output(['debugfs','-R','cat '+path,str(rootfs)],stderr=subprocess.DEVNULL)
           osrelease=read('/usr/lib/os-release').decode()
           assert 'IMAGE_VERSION="v0.2.0-rc.2"' in osrelease or 'IMAGE_VERSION=v0.2.0-rc.2\n' in osrelease,osrelease
           manifest=json.loads(read('/usr/share/lapis-update/bootstrap/manifest.json'))
           assert manifest['channel']==channel
           assert manifest['version']==version
           assert manifest['min_os_version']=='0.2.0-rc.1'
           assert manifest['toplevel_store_path']=='/nix/store/'+closure
           assert read('/etc/lapis-update/channel-default').decode().strip()==channel
           assert read('/usr/share/lapis/versions/update').decode().strip()=='1.1.10'
           revision=subprocess.check_output(['git','-C',str(sdk/'external/lapis'),'rev-parse','HEAD'],text=True).strip()
           assert revision==EXPECTED_SOURCE,revision
           deb=sdk/'mkosi/packages/sdk-built/lapis-update_1.1.10_arm64.deb'
           archive=subprocess.check_output(['dpkg-deb','--fsys-tarfile',str(deb)])
           with tarfile.open(fileobj=io.BytesIO(archive)) as t: packaged=t.extractfile('./usr/bin/lapis-update').read()
           binary=read('/usr/bin/lapis-update')
           assert binary==packaged,'installed updater differs from freshly built package'
           sums={line.split(None,1)[1].strip():line.split(None,1)[0] for line in (release/'SHA256SUMS').read_text().splitlines()}
           results=[]
           for rel,want in sums.items():
            if rel=='IMAGES/update.img.xz' or rel=='IMAGES/uboot.img' or rel.endswith('.raucb'):
             p=release/rel;actual=sha(p);assert actual==want,rel
             results.append(dict(name=rel,size=p.stat().st_size,sha256=actual))
           assert len(results)==3,results
           bundle=next(release/x['name'] for x in results if x['name'].endswith('.raucb'))
           with tempfile.TemporaryDirectory() as d:
            ca=Path(d)/'ca.pem';ca.write_bytes(read('/etc/rauc/ca.cert.pem'));assert ca.stat().st_size>0
            result=subprocess.run(['rauc','info','--keyring='+str(ca),str(bundle)],capture_output=True,text=True)
            assert result.returncode==0,result.stderr
            assert 'v0.2.0-rc.2' in result.stdout
           print('RC2_VERIFIED '+json.dumps(dict(workspace=name,image_version='v0.2.0-rc.2',channel=channel,seed_version=version,closure=manifest['toplevel_store_path'],updater_revision=revision,updater_version='1.1.10',updater_sha256=hashlib.sha256(binary).hexdigest(),rauc_verified_against_image_ca=True,artifacts=results)),flush=True)
          PYVERIFY
  publish_dvt_rc2_dev:
    if: inputs.publish_dvt_rc2_dev == true
    runs-on: [self-hosted, linux, x64, rk3576, bsp]
    timeout-minutes: 20
    steps:
      - name: Set up publisher Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Build and test pinned OTA publisher
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAMIR_GITHUB_TOKEN }}
          GOPRIVATE: github.com/Pamir-AI/*,github.com/pamir-ai-pkgs/*
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.https://github.com.helper
          GIT_CONFIG_VALUE_1: '!gh auth git-credential'
        run: |
          set -euo pipefail
          source=/srv/bsp/workspaces/pamir-rk3576-dvt-candidate/bsp-tools
          revision=b68be34868fcab14a94bbcc24ca9092953a991ed
          test "$(git -C "$source" rev-parse HEAD)" = "$revision"
          build_dir=$(mktemp -d "$RUNNER_TEMP/ota-publisher.XXXXXX")
          git -C "$source" archive "$revision" ota-publish | tar -x -C "$build_dir"
          # This exact module commit still exists but is no longer discoverable
          # through advertised refs. Fetch its full SHA without changing the pin.
          server_revision=223b3547554c3701f4705a27eb6bf74f034d19b0
          git init "$build_dir/ota-server"
          git -C "$build_dir/ota-server" remote add origin https://github.com/Pamir-AI/lapis-ota-server.git
          git -C "$build_dir/ota-server" fetch --depth=1 origin "$server_revision"
          git -C "$build_dir/ota-server" checkout --detach FETCH_HEAD
          test "$(git -C "$build_dir/ota-server" rev-parse HEAD)" = "$server_revision"
          cd "$build_dir/ota-publish"
          go mod edit -replace "github.com/Pamir-AI/lapis-ota-server=$build_dir/ota-server"
          go vet ./...
          go test ./...
          go build -trimpath -o "$build_dir/ota-publish-cli" .
          echo "OTA_PUBLISH_BIN=$build_dir/ota-publish-cli" >> "$GITHUB_ENV"
          sha256sum "$build_dir/ota-publish-cli"
      - name: Verify and publish DVT rc.2 to shared dev channel
        shell: bash
        run: |
          export PATH="$PATH:/usr/sbin:/sbin"
          python3 - <<'PYPUBLISH'
          from pathlib import Path
          import base64,hashlib,json,os,subprocess,tempfile,urllib.parse,urllib.request
          sdk=Path('/srv/bsp/workspaces/pamir-rk3576-dvt-candidate')
          release=sdk/'output/releases/ci/37172720465-2'
          bundle=release/'IMAGES/lapis-dvt-dev-v0.2.0-rc.2.raucb'
          uboot=release/'IMAGES/uboot.img'
          want_bundle='4f63ff16d10751e761ca582ebeba689e0fe046f0051df0b0ba452a65d7b9938f'
          want_uboot='2a365ffce672b3ed97b557f74ba87d944ad221522cc65400c6e2b7156f8a7c60'
          version='0.2.0-rc.2'
          def digest(path):
           h=hashlib.sha256()
           with path.open('rb') as f:
            for block in iter(lambda:f.read(8*1024*1024),b''):h.update(block)
           return h.hexdigest()
          assert digest(bundle)==want_bundle,'DVT bundle hash mismatch'
          assert digest(uboot)==want_uboot,'DVT U-Boot hash mismatch'
          assert bundle.stat().st_size==811133642 and uboot.stat().st_size==4194304
          rootfs=sdk/'mkosi/lapis-rootfs.img'
          def image_read(path):
           return subprocess.check_output(['debugfs','-R','cat '+path,str(rootfs)],stderr=subprocess.DEVNULL)
          with tempfile.TemporaryDirectory() as tmp:
           tmp=Path(tmp)
           ca=tmp/'ca.pem';ca.write_bytes(image_read('/etc/rauc/ca.cert.pem'))
           info=subprocess.check_output(['rauc','info','--keyring='+str(ca),'--output-format=json',str(bundle)],text=True)
           parsed=json.loads(info)
           assert parsed['version']=='v'+version and parsed['compatible']=='pamir-lapis-rk3576-dev',parsed
           env=dict(os.environ,AWS_REGION='us-west-2',AWS_DEFAULT_REGION='us-west-2')
           env.pop('AWS_PROFILE',None)
           identity=json.loads(subprocess.check_output(['aws','sts','get-caller-identity','--output','json'],env=env))
           assert identity['Account']=='322551983552'
           assert identity['Arn'].startswith('arn:aws:sts::322551983552:assumed-role/lapis-ota-build/'),identity['Arn']
           print('Publishing identity:',identity['Arn'],flush=True)
           tokens=subprocess.check_output(['aws','secretsmanager','get-secret-value','--secret-id','lapis-ota/fleet-tokens','--query','SecretString','--output','text'],env=env,text=True)
           token=next(x.strip() for x in reversed(tokens.splitlines()) if x.strip())
           pub=tmp/'manifest-key.der';pub.write_bytes(base64.b64decode(image_read('/etc/lapis-ota/manifest.p256.pub').strip()))
           def check(current):
            query=urllib.parse.urlencode(dict(board='lapis',channel='dev',current_version='0.2.0',current_version_full=current,machine_id='ci-rc2-dvt-publish-verifier'))
            req=urllib.request.Request('https://bf0agb75f8.execute-api.us-west-2.amazonaws.com/api/v1/updates/check?'+query,headers={'Authorization':'LapisOTA-v1 '+token})
            with urllib.request.urlopen(req,timeout=30) as response: result=json.load(response)
            sig=result['signature'];assert sig['alg']=='ecdsa-p256-sha256-der',sig['alg']
            payload={k:v for k,v in result.items() if k!='signature'}
            data=tmp/'payload.json';data.write_text(json.dumps(payload,sort_keys=True,separators=(',',':'),ensure_ascii=False))
            signature=tmp/'signature.der';signature.write_bytes(base64.b64decode(sig['value']))
            subprocess.run(['openssl','dgst','-sha256','-verify',str(pub),'-keyform','DER','-signature',str(signature),str(data)],check=True,stdout=subprocess.DEVNULL)
            assert result['board']=='lapis' and result['channel']=='dev'
            return result
           def validate_offer(result):
            update=result['update'];assert result['update_available']
            assert update['version']==version and update['sha256']==want_bundle and update['size']==811133642
            assert update['uboot']['sha256']==want_uboot and update['uboot']['size']==4194304
           before=check('0.2.0-rc.1')
           if before.get('update',{}).get('version')==version:
            validate_offer(before);print('Matching release is already live; no duplicate publication.',flush=True)
           else:
            assert not before.get('update_available'),'Unexpected newer dev release already offered; refusing to supersede it blindly'
            subprocess.run([os.environ['OTA_PUBLISH_BIN'],'publish','--bundle',str(bundle),'--uboot',str(uboot),'--board','lapis','--channel','dev','--version',version,'--region','us-west-2','--bucket','pamir-ota-bundles','--table','lapis-ota-releases'],env=env,check=True)
           after=check('0.2.0-rc.1');validate_offer(after)
           installed=check(version);assert not installed['update_available'],'Installed rc.2 is offered a reinstall'
           print('OTA_PUBLISH_VERIFIED '+json.dumps(dict(board='lapis',channel='dev',version=version,bundle_sha256=want_bundle,uboot_sha256=want_uboot,manifest_signature_verified=True,offer_from_rc1_verified=True,no_reinstall_on_rc2_verified=True)),flush=True)
          PYPUBLISH
  build:
    if: inputs.diagnose_runner != true && inputs.publish_dvt_rc2_dev != true
    name: Build and publish ${{ matrix.board }} images
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        board: [evt3, dvt]
    runs-on:
      - self-hosted
      - linux
      - x64
      - rk3576
      - bsp
    timeout-minutes: 1440
    env:
      AWS_DEFAULT_REGION: eu-north-1
      AWS_REGION: eu-north-1
      ARTIFACT_DOWNLOAD_BASE_URL: https://d16xxnueu5edhn.cloudfront.net
      ARTIFACT_DOWNLOAD_TOKEN: ${{ secrets.PAMIR_ARTIFACT_DOWNLOAD_TOKEN }}
      # Rust from-source packages (lapis-hwserviced) pull sibling crates as
      # git dependencies. Cargo's built-in libgit2 transport ignores the
      # insteadOf token rewrite and only knows ssh-agent, so route its
      # fetches through the git CLI, which honours the rewrite configured in
      # "Configure GitHub authentication".
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      BOARD_VARIANT: ${{ matrix.board }}
      # Defaults retain the EVT3 contract; the resolver selects each matrix board.
      DEFCONFIG: rockchip_rk3576_lapis_evt3_defconfig
      SECURE_DEFCONFIG: rockchip_rk3576_lapis_evt3_secure_defconfig
      MANIFEST_FILE: rk3576-debian-ab.xml
      MANIFEST_URL: https://github.com/pamir-ai-pkgs/manifest
      MIN_FREE_GIB: "50"
      OTA_PUBLISH_REGION: us-west-2
      OTA_PUBLISH_ROLE_ARN: arn:aws:iam::322551983552:role/lapis-ota-publish-ci
      PRE_COMMIT_HOME: /srv/bsp/pre-commit-cache
      REPO_MIRROR: /srv/bsp/repo-mirror
      S3_BUCKET: lapis-os-artifacts
      UV_CACHE_DIR: /srv/bsp/uv-cache
      WORK_ROOT: /srv/bsp/workspaces
      XDG_CACHE_HOME: /srv/bsp/cache

    steps:
      - name: Checkout manifest repo
        uses: actions/checkout@v6.0.3
        with:
          path: manifest-checkout

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false

      - name: Install repo tool
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          if ! command -v repo >/dev/null 2>&1; then
            curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
              -o "$HOME/.local/bin/repo"
            chmod 0755 "$HOME/.local/bin/repo"
          fi
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Configure GitHub authentication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAMIR_GITHUB_TOKEN }}
        run: |
          # A runner crash can skip cleanup and leave all three rewrite values.
          git config --global --replace-all \
            url."https://x-access-token:${GH_TOKEN}@github.com/pamir-ai-pkgs/".insteadOf \
            "https://github.com/pamir-ai-pkgs/"
          # Cargo git dependencies may be declared with SSH URLs; the runner
          # has no deploy key, so fold those onto the same token rewrite.
          # Both forms live in one url.<token> section, which the
          # "Remove ephemeral GitHub token rewrite" step drops wholesale.
          git config --global --add \
            url."https://x-access-token:${GH_TOKEN}@github.com/pamir-ai-pkgs/".insteadOf \
            "ssh://git@github.com/pamir-ai-pkgs/"
          git config --global --add \
            url."https://x-access-token:${GH_TOKEN}@github.com/pamir-ai-pkgs/".insteadOf \
            "git@github.com:pamir-ai-pkgs/"
          gh auth status

      - name: Resolve build parameters
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          DISPATCH_MANIFEST_REF: ${{ inputs.manifest_ref }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          manifest_ref="${DISPATCH_MANIFEST_REF:-main}"
          channel="${DISPATCH_CHANNEL:-dev}"
          version="${DISPATCH_VERSION:-}"
          stable_tag_regex='^rk3576-v[0-9]+[.][0-9]+[.][0-9]+$'
          candidate_tag_regex='^rk3576-v[0-9]+[.][0-9]+[.][0-9]+-rc[.][0-9]+$'
          nightly_tag_regex='^rk3576-v[0-9]+[.][0-9]+[.][0-9]+-nightly[.][0-9]+$'

          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ $candidate_tag_regex ]]; then
              manifest_ref="refs/tags/$GITHUB_REF_NAME"
              channel="candidate"
              version="$GITHUB_REF_NAME"
            elif [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ $stable_tag_regex ]]; then
              manifest_ref="refs/tags/$GITHUB_REF_NAME"
              channel="stable"
              version="$GITHUB_REF_NAME"
            elif [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ $nightly_tag_regex ]]; then
              # Pushed by the nightly stager (rk3576-bsp-nightly.yml) on a
              # commit-pinned nightly/YYYY-MM-DD manifest.
              manifest_ref="refs/tags/$GITHUB_REF_NAME"
              channel="nightly"
              version="$GITHUB_REF_NAME"
            elif [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == rk3576-v* ]]; then
              echo "unsupported RK3576 release tag: $GITHUB_REF_NAME" >&2
              echo "use rk3576-vX.Y.Z, rk3576-vX.Y.Z-rc.N, or rk3576-vX.Y.Z-nightly.N" >&2
              exit 1
            else
              manifest_ref="$GITHUB_REF_NAME"
              channel="dev"
              version="rk3576-dev-${GITHUB_SHA:0:12}"
            fi
          elif [[ "$channel" == "candidate" ]]; then
            if [[ -z "$version" ]]; then
              version="${manifest_ref#refs/tags/}"
            fi
            if [[ ! "$version" =~ $candidate_tag_regex ]]; then
              echo "candidate dispatch requires rk3576-vX.Y.Z-rc.N version" >&2
              exit 1
            fi
            if [[ "$manifest_ref" == "$version" ]]; then
              manifest_ref="refs/tags/$version"
            fi
            if [[ "$manifest_ref" != "refs/tags/$version" ]]; then
              echo "candidate dispatch must build the same tag it publishes" >&2
              exit 1
            fi
          elif [[ "$channel" == "stable" ]]; then
            if [[ -z "$version" ]]; then
              version="${manifest_ref#refs/tags/}"
            fi
            if [[ ! "$version" =~ $stable_tag_regex ]]; then
              echo "stable dispatch requires rk3576-vX.Y.Z version" >&2
              exit 1
            fi
            if [[ "$manifest_ref" == "$version" ]]; then
              manifest_ref="refs/tags/$version"
            fi
            if [[ "$manifest_ref" != "refs/tags/$version" ]]; then
              echo "stable dispatch must build the same tag it publishes" >&2
              exit 1
            fi
          elif [[ "$channel" == "nightly" ]]; then
            # Rebuild of an existing nightly tag; the stager creates them.
            if [[ -z "$version" ]]; then
              version="${manifest_ref#refs/tags/}"
            fi
            if [[ ! "$version" =~ $nightly_tag_regex ]]; then
              echo "nightly dispatch requires rk3576-vX.Y.Z-nightly.N version" >&2
              exit 1
            fi
            if [[ "$manifest_ref" == "$version" ]]; then
              manifest_ref="refs/tags/$version"
            fi
            if [[ "$manifest_ref" != "refs/tags/$version" ]]; then
              echo "nightly dispatch must build the same tag it publishes" >&2
              exit 1
            fi
          fi

          build_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sdk_dir="${WORK_ROOT%/}/pamir-rk3576-${channel}"

          # Bundles only for tagged builds, where VERSION matches the baked
          # IMAGE_VERSION; a mismatched bundle reinstall-loops on devices.
          rauc_bundle=0
          if [[ "$channel" == "stable" || "$channel" == "candidate" || "$channel" == "nightly" ]]; then
            rauc_bundle=1
          fi

          # Secure-leg S3 prefix, mirroring the dev leg's channel layout.
          # Nightlies keep both legs under one nightly/ tree so the prune job
          # can drop a whole night by tag; the dev leg's prefix is passed
          # explicitly there because the release driver knows no nightly
          # channel and would otherwise file it under dev/.
          sec_s3_prefix=""
          dev_s3_prefix=""
          if [[ "$channel" == "stable" ]]; then
            sec_s3_prefix="s3://${S3_BUCKET}/pamir-rk3576/releases/${version}-sec"
          elif [[ "$channel" == "candidate" ]]; then
            sec_s3_prefix="s3://${S3_BUCKET}/pamir-rk3576/candidates/${version}-sec/${build_id}"
          elif [[ "$channel" == "nightly" ]]; then
            dev_s3_prefix="s3://${S3_BUCKET}/pamir-rk3576/nightly/${version}/${build_id}"
            sec_s3_prefix="s3://${S3_BUCKET}/pamir-rk3576/nightly/${version}-sec/${build_id}"
          fi

          board="${BOARD_VARIANT:-evt3}"
          case "$board" in evt3|dvt) ;; *) echo "unsupported board: $board" >&2; exit 1 ;; esac
          sec_sdk_dir="${WORK_ROOT%/}/pamir-rk3576-secure"
          dev_asset_suffix=""
          sec_asset_suffix="-secure"
          dev_image_label="Dev"
          sec_image_label="Secure"
          dev_notes_mode="replace"
          dev_pointer_name="latest.json"
          dev_stable_pointer_name="dev-latest.json"
          sec_pointer_name="sec-latest.json"
          if [[ "$board" == dvt ]]; then
            sdk_dir="${WORK_ROOT%/}/pamir-rk3576-dvt-${channel}"
            sec_sdk_dir="${WORK_ROOT%/}/pamir-rk3576-dvt-secure"
            dev_asset_suffix="-dvt"
            sec_asset_suffix="-dvt-secure"
            dev_image_label="DVT-Dev"
            sec_image_label="DVT-Secure"
            dev_notes_mode="append"
            dev_pointer_name="dvt-latest.json"
            dev_stable_pointer_name="dvt-dev-latest.json"
            sec_pointer_name="dvt-sec-latest.json"
            case "$channel" in
              stable)
                dev_s3_prefix="s3://${S3_BUCKET}/pamir-rk3576/releases/${version}-dvt"
                sec_s3_prefix="s3://${S3_BUCKET}/pamir-rk3576/releases/${version}-dvt-sec" ;;
              candidate|nightly)
                prefix_group=candidates
                [[ "$channel" != nightly ]] || prefix_group=nightly
                dev_s3_prefix="s3://${S3_BUCKET}/pamir-rk3576/${prefix_group}/${version}-dvt/${build_id}"
                sec_s3_prefix="s3://${S3_BUCKET}/pamir-rk3576/${prefix_group}/${version}-dvt-sec/${build_id}" ;;
              *)
                dev_s3_prefix="s3://${S3_BUCKET}/pamir-rk3576/${channel}/${manifest_ref//\//-}-dvt/${build_id}" ;;
            esac
          fi

          # Prerelease channels bake their prerelease suffix
          # (v0.1.0-rc.2, v0.2.0-nightly.N) so a device reports exactly
          # which build it runs and current_version_full stays truthful
          # end to end.
          rk_image_version=""
          if [[ "$channel" == "candidate" || "$channel" == "nightly" ]]; then
            rk_image_version="${version#rk3576-}"
          fi

          {
            echo "RAUC_BUNDLE=$rauc_bundle"
            echo "RK_IMAGE_VERSION=$rk_image_version"
            echo "DEV_S3_PREFIX=$dev_s3_prefix"
            echo "SEC_S3_PREFIX=$sec_s3_prefix"
            echo "BUILD_ID=$build_id"
            echo "CHANNEL=$channel"
            echo "MANIFEST_REF=$manifest_ref"
            echo "SDK_DIR=$sdk_dir"
            echo "SEC_SDK_DIR=$sec_sdk_dir"
            echo "DEFCONFIG=rockchip_rk3576_lapis_${board}_defconfig"
            echo "SECURE_DEFCONFIG=rockchip_rk3576_lapis_${board}_secure_defconfig"
            echo "DEV_ASSET_SUFFIX=$dev_asset_suffix"
            echo "SEC_ASSET_SUFFIX=$sec_asset_suffix"
            echo "DEV_IMAGE_LABEL=$dev_image_label"
            echo "SEC_IMAGE_LABEL=$sec_image_label"
            echo "DEV_NOTES_MODE=$dev_notes_mode"
            echo "DEV_POINTER_NAME=$dev_pointer_name"
            echo "DEV_STABLE_POINTER_NAME=$dev_stable_pointer_name"
            echo "SEC_POINTER_NAME=$sec_pointer_name"
            echo "VERSION=${version:-rk3576-${channel}-${build_id}}"
          } >>"$GITHUB_ENV"

      - name: Bootstrap BSP tools
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAMIR_GITHUB_TOKEN }}
        run: |
          mkdir -p "$UV_CACHE_DIR" "$XDG_CACHE_HOME" "$PRE_COMMIT_HOME" "$REPO_MIRROR"
          python3 --version
          manifest-checkout/ci/bootstrap-workspace.sh "$SDK_DIR"

      - name: Converge runner build deps
        shell: bash
        run: |
          # bsp-tools owns the runner dependency list; converge the host to
          # it so a dep added on main (e.g. rauc for bundle builds) cannot
          # outrun the runner AMI. Idempotent once installed.
          sudo WORK_ROOT=/srv/bsp "$SDK_DIR/bsp-tools/ci/bootstrap-debian-runner.sh"

      - name: Clean stale BSP outputs
        shell: bash
        run: |
          shopt -s nullglob
          # The Incremental mkosi cache (a bookworm base from the prior release)
          # must not survive the bookworm->trixie switch or apt resolves stale
          # bookworm packages (libpipewire deb12u1, old libdrm/libwayland) into
          # trixie. Wipe every location mkosi may cache the base/packages in.
          for workspace in "$WORK_ROOT"/pamir-rk3576-*; do
            # Leave the other board's outputs available for retries and inspection.
            [[ "$workspace" == "$SDK_DIR" || "$workspace" == "$SEC_SDK_DIR" ]] || continue
            rm -rf "$workspace/output" "$workspace/rockdev" \
                   "$workspace/mkosi/mkosi.cache" "$workspace/mkosi/mkosi.builddir" \
                   "$workspace/mkosi"/mkosi.cache.* 2>/dev/null || true
          done
          rm -rf "${XDG_CACHE_HOME:-$HOME/.cache}/mkosi" 2>/dev/null || true

      - name: Validate release tooling
        shell: bash
        run: |
          # The tooling self-tests build ext4 fixture images; the runner
          # service PATH lacks the sbin dirs where mkfs.ext4 lives.
          export PATH="$PATH:/usr/sbin:/sbin"
          # A workflow_dispatch repair can execute a newer orchestration revision
          # against the same immutable image-source tag. Validate that actual
          # workflow in an isolated repo-sync layout, without editing the tag's
          # manifest checkout or changing any component source.
          validation_dir=$(mktemp -d)
          trap 'rm -rf "$validation_dir"' EXIT
          git clone --quiet --shared "$SDK_DIR/bsp-tools" "$validation_dir/bsp-tools"
          mkdir -p "$validation_dir/.repo"
          ln -s "$GITHUB_WORKSPACE/manifest-checkout" "$validation_dir/.repo/manifests"
          cd "$validation_dir/bsp-tools"
          uv run --locked pre-commit run --all-files

      - name: Runner preflight
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAMIR_GITHUB_TOKEN }}
        run: |
          cd "$SDK_DIR"
          # Stale outputs can carry root-owned files (mkosi runs as root)
          # and read-only Go module caches; a plain rm cannot clear either.
          sudo rm -rf output rockdev
          bsp-tools/ci/preflight-runner.sh

      - name: Provision FIT boot-chain signing keys
        shell: bash
        env:
          BOOT_KEYS_TGZ_B64: ${{ secrets.PAMIR_BOOT_KEYS_TGZ_B64 }}
          OTP_PUBKEY_SHA256: ${{ vars.PAMIR_OTP_PUBKEY_SHA256 }}
        run: |
          # RK_SECURE_BOOT=y signs the loader and both FIT keyrings from
          # u-boot/keys/. These MUST be the canonical fielded keys: the OTP
          # hash and the keyrings baked into fielded SPL/U-Boot only verify
          # images signed by them, so regenerating keys in CI (or silently
          # picking up stale keys left on the persistent runner workspace)
          # ships an unbootable or bricking OTA. Wipe the keys dir and
          # materialize the set from the secret; the AVB step below re-adds
          # avb_vbmeta.pem, so this step must stay ordered before it.
          if [ -z "${BOOT_KEYS_TGZ_B64:-}" ]; then
            echo "::error::PAMIR_BOOT_KEYS_TGZ_B64 secret is not set" >&2
            exit 1
          fi
          if [ -z "${OTP_PUBKEY_SHA256:-}" ]; then
            echo "::error::PAMIR_OTP_PUBKEY_SHA256 variable is not set" >&2
            exit 1
          fi
          keys_dir="$SDK_DIR/u-boot/keys"
          rm -rf "$keys_dir"
          install -d -m 0700 "$keys_dir"
          ( umask 077
            printf '%s' "$BOOT_KEYS_TGZ_B64" | base64 -d \
              | tar -xzf - -C "$keys_dir" )
          missing=0
          for f in dev.key dev.pubkey dev.crt root.key root.pubkey root.crt \
              ub-v1.key kernel-v1.key \
              ub-v1.crt ub-v2.crt ub-v3.crt ub-v4.crt ub-v5.crt \
              ub-v1.pubkey ub-v2.pubkey ub-v3.pubkey ub-v4.pubkey \
              ub-v5.pubkey \
              kernel-v1.crt kernel-v2.crt kernel-v3.crt kernel-v4.crt \
              kernel-v5.crt \
              kernel-v1.pubkey kernel-v2.pubkey kernel-v3.pubkey \
              kernel-v4.pubkey kernel-v5.pubkey; do
            if [ ! -s "$keys_dir/$f" ]; then
              echo "::error::boot key set is missing $f" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { rm -rf "$keys_dir"; exit 1; }
          for k in dev root ub-v1 kernel-v1; do
            if ! openssl rsa -in "$keys_dir/$k.key" -check -noout \
                >/dev/null 2>&1; then
              echo "::error::$k.key is not a valid RSA private key" >&2
              rm -rf "$keys_dir"
              exit 1
            fi
          done
          # security-createkeys names the rk_sign_tool output
          # private_key.pem/public_key.pem and symlinks dev.* onto it;
          # symlinks don't survive the tarball, so recreate the aliases.
          ln -rsf "$keys_dir/dev.key" "$keys_dir/private_key.pem"
          ln -rsf "$keys_dir/dev.pubkey" "$keys_dir/public_key.pem"
          # Brick guard: dev.pubkey must be the OTP-bound key; a mismatch
          # means fielded BootROM/SPL cannot verify what we sign.
          got="$(sha256sum "$keys_dir/dev.pubkey" | cut -d' ' -f1)"
          if [ "$got" != "$OTP_PUBKEY_SHA256" ]; then
            echo "::error::dev.pubkey sha256 $got does not match" \
              "PAMIR_OTP_PUBKEY_SHA256 — refusing to sign with a key the" \
              "fielded OTP anchor cannot verify" >&2
            rm -rf "$keys_dir"
            exit 1
          fi
          echo "FIT boot-chain signing keys provisioned at u-boot/keys/" \
            "(dev.pubkey verified against OTP anchor hash)"

      - name: Provision AVB vbmeta signing key
        shell: bash
        env:
          AVB_VBMETA_KEY_B64: ${{ secrets.PAMIR_AVB_VBMETA_KEY_B64 }}
        run: |
          # RK_PAMIR_AVB_VERITY=y / CONFIG_PAMIR_AVB_ENFORCE=y require the
          # RSA-4096 vbmeta key at build time: U-Boot pins its public key and
          # the mkosi stage signs per-slot vbmeta. The key is never committed
          # (u-boot/keys/ is gitignored), so materialize it from the secret
          # after sync and before the build, into the path both consumers read.
          if [ -z "${AVB_VBMETA_KEY_B64:-}" ]; then
            echo "::error::PAMIR_AVB_VBMETA_KEY_B64 secret is not set" >&2
            exit 1
          fi
          install -d -m 0700 "$SDK_DIR/u-boot/keys"
          ( umask 077
            printf '%s' "$AVB_VBMETA_KEY_B64" | base64 -d \
              > "$SDK_DIR/u-boot/keys/avb_vbmeta.pem" )
          if ! head -1 "$SDK_DIR/u-boot/keys/avb_vbmeta.pem" \
              | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "::error::decoded AVB key is not a PEM private key" >&2
            rm -f "$SDK_DIR/u-boot/keys/avb_vbmeta.pem"
            exit 1
          fi
          echo "AVB vbmeta signing key provisioned at u-boot/keys/avb_vbmeta.pem"

      - name: Ensure mkosi >= 26
        shell: bash
        run: |
          # mkosi.conf needs >=26; trixie has 25.3 (apt), not on PyPI. Install v26
          # from git via uv and symlink it over every copy the build's login shell
          # might resolve (it prefers ~/.local/bin), verifying via a login shell.
          uv tool install --force "mkosi @ git+https://github.com/systemd/mkosi@v26"
          bin="$(uv tool dir --bin 2>/dev/null || echo "$HOME/.local/bin")"
          got="$("$bin/mkosi" --version 2>/dev/null | grep -oE '[0-9]+' | head -1 || echo 0)"
          if [ "${got:-0}" -lt 26 ]; then
            echo "::error::mkosi v26 install failed (got ${got:-none} at ${bin})" >&2
            exit 1
          fi
          echo "mkosi copies before override:"; which -a mkosi 2>/dev/null || true
          for cand in "$HOME/.local/bin/mkosi" /usr/local/bin/mkosi /usr/bin/mkosi "$(command -v mkosi 2>/dev/null)"; do
            [ -n "$cand" ] && [ "$cand" != "$bin/mkosi" ] || continue
            d="$(dirname "$cand")"
            if [ -w "$d" ] 2>/dev/null; then ln -sf "$bin/mkosi" "$cand"; else sudo ln -sf "$bin/mkosi" "$cand" 2>/dev/null || true; fi
          done
          echo "$bin" >> "$GITHUB_PATH"
          echo "mkosi copies after override:"; which -a mkosi 2>/dev/null || true
          login_ver="$(bash -lc 'mkosi --version' 2>/dev/null || true)"
          echo "login-shell mkosi (what build.sh uses): ${login_ver:-unknown} at $(bash -lc 'command -v mkosi' 2>/dev/null)"
          if ! echo "$login_ver" | grep -qE '2[6-9]|[3-9][0-9]'; then
            echo "::error::build login shell still resolves mkosi < 26 (${login_ver:-none})" >&2
            exit 1
          fi

      - name: Build and upload release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAMIR_GITHUB_TOKEN }}
        run: |
          # DVT and nightly builds use explicit prefixes to keep their artifacts
          # separate; EVT3 otherwise retains the driver's existing layout.
          cd "$SDK_DIR"
          RELEASE_IMAGE_LABEL="$DEV_IMAGE_LABEL" \
          CHANNEL_POINTER_NAME="$DEV_POINTER_NAME" \
          STABLE_POINTER_NAME="$DEV_STABLE_POINTER_NAME" \
          S3_PREFIX="$DEV_S3_PREFIX" \
          RAUC_BUNDLE=1 \
            bsp-tools/ci/build-and-upload-release.sh

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          cd "$SDK_DIR"
          ASSET_NAME_SUFFIX="$DEV_ASSET_SUFFIX" \
          RELEASE_NOTES_MODE="$DEV_NOTES_MODE" \
            bsp-tools/ci/publish-github-release.sh

      # Only publish OTA for final release tags. Nightlies are not published
      # to any OTA channel: their bundles are on S3 and attached to the
      # GitHub prerelease.
      - name: Publish dev OTA release
        if: env.CHANNEL == 'stable' && env.BOARD_VARIANT == 'evt3'
        shell: bash
        run: |
          # Dev images poll lapis/dev.
          manifest-checkout/ci/ota-publish-release.sh "$SDK_DIR" dev

      # Secure leg for the selected board: tagged builds ship the signed secure image, built
      # serially after the dev leg so its failure cannot block that release.
      # Nightlies build it too, uploaded under nightly/<tag>-sec only and not
      # published to any OTA channel.
      - name: Bootstrap secure workspace BSP tools
        if: env.CHANNEL == 'stable' || env.CHANNEL == 'candidate' || env.CHANNEL == 'nightly'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAMIR_GITHUB_TOKEN }}
        run: |
          # Separate workspace: mk-rauc-bundle.sh resolves the firmware dir
          # relative to the invoking bsp-tools checkout.
          manifest-checkout/ci/bootstrap-workspace.sh "$SEC_SDK_DIR"

      - name: Stage signing keys into the secure workspace
        if: env.CHANNEL == 'stable' || env.CHANNEL == 'candidate' || env.CHANNEL == 'nightly'
        shell: bash
        run: |
          # Reuse the OTP-verified key set staged above; cp -a keeps the
          # private_key.pem/public_key.pem symlinks.
          if [ ! -s "$SDK_DIR/u-boot/keys/dev.pubkey" ] ||
            [ ! -s "$SDK_DIR/u-boot/keys/avb_vbmeta.pem" ]; then
            echo "::error::validated signing keys are missing from" \
              "$SDK_DIR/u-boot/keys" >&2
            exit 1
          fi
          rm -rf "$SEC_SDK_DIR/u-boot/keys"
          install -d -m 0700 "$SEC_SDK_DIR/u-boot/keys"
          cp -a "$SDK_DIR/u-boot/keys/." "$SEC_SDK_DIR/u-boot/keys/"

      - name: Build and upload secure release
        if: env.CHANNEL == 'stable' || env.CHANNEL == 'candidate' || env.CHANNEL == 'nightly'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAMIR_GITHUB_TOKEN }}
          RK_LAPIS_USER_PASSWORD: ${{ secrets.PAMIR_LAPIS_USER_PASSWORD }}
          LAPIS_CF_ACCESS_SIT: ${{ secrets.PAMIR_LAPIS_CF_ACCESS_SIT }}
        run: |
          # A production image takes the lapis password from this env; when
          # it is unset the build silently ships the defconfig placeholder,
          # so fail loud instead.
          if [ -z "${RK_LAPIS_USER_PASSWORD:-}" ]; then
            echo "::error::PAMIR_LAPIS_USER_PASSWORD secret is not set" >&2
            exit 1
          fi
          # The secure leg polls the SIT nix channel (device-rockchip#26), so
          # its bootstrap seed fetch needs the sit CF Access service token.
          # Staged through mkosi's hardened RK_LAPIS_CF_ACCESS_FILE input
          # (0700 tmpfs dir, 0600 file, strict JSON contract) — never through
          # Kconfig strings, so no token enters git history. Fail loud when
          # absent: without it the leg would ride the in-tree dev token and
          # 401 against manifests/sit at seed-fetch time.
          if [ -z "${LAPIS_CF_ACCESS_SIT:-}" ]; then
            echo "::error::PAMIR_LAPIS_CF_ACCESS_SIT secret is not set" >&2
            exit 1
          fi
          cfdir=$(mktemp -d -p /dev/shm)
          trap 'rm -rf "$cfdir"' EXIT
          chmod 0700 "$cfdir"
          (umask 077; printf '%s' "$LAPIS_CF_ACCESS_SIT" > "$cfdir/cf-access.json")
          export RK_LAPIS_CF_ACCESS_FILE="$cfdir/cf-access.json"
          # VERSION stays the tag: bundle version must equal the baked
          # IMAGE_VERSION. The -sec prefix and sec-latest.json pointers keep
          # the release lines apart; CHANNEL_POINTER_NAME needs the matching
          # bsp-tools knob.
          cd "$SEC_SDK_DIR"
          if [[ "$BOARD_VARIANT" == evt3 ]]; then
            export STABLE_POINTER_NAME=sec-latest.json
            export CHANNEL_POINTER_NAME=sec-latest.json
          else
            export STABLE_POINTER_NAME="$SEC_POINTER_NAME"
            export CHANNEL_POINTER_NAME="$SEC_POINTER_NAME"
          fi
          SDK_DIR="$SEC_SDK_DIR" \
          DEFCONFIG="$SECURE_DEFCONFIG" \
          RELEASE_IMAGE_LABEL="$SEC_IMAGE_LABEL" \
          RAUC_BUNDLE=1 \
          S3_PREFIX="$SEC_S3_PREFIX" \
            bsp-tools/ci/build-and-upload-release.sh

      - name: Attach secure artifacts to the GitHub release
        if: env.CHANNEL == 'stable' || env.CHANNEL == 'candidate' || env.CHANNEL == 'nightly'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          cd "$SEC_SDK_DIR"
          if [[ "$BOARD_VARIANT" == evt3 ]]; then
            ASSET_NAME_SUFFIX=-secure
          else
            ASSET_NAME_SUFFIX="$SEC_ASSET_SUFFIX"
          fi
          export ASSET_NAME_SUFFIX
          SDK_DIR="$SEC_SDK_DIR" \
          RELEASE_NOTES_MODE=append \
            bsp-tools/ci/publish-github-release.sh

      - name: Publish secure OTA release
        if: env.CHANNEL == 'stable' && env.BOARD_VARIANT == 'evt3'
        shell: bash
        run: |
          # Secure images poll lapis/sit.
          manifest-checkout/ci/ota-publish-release.sh "$SEC_SDK_DIR" sit

      - name: Remove ephemeral GitHub token rewrite
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAMIR_GITHUB_TOKEN }}
        run: |
          git config --global --remove-section \
            "url.https://x-access-token:${GH_TOKEN}@github.com/pamir-ai-pkgs/" || true

      - name: Wipe provisioned signing keys
        if: always()
        shell: bash
        run: |
          # Both workspaces' u-boot/keys; the provisioning steps recreate
          # them from secrets on every run.
          rm -rf "${SDK_DIR:-/nonexistent}/u-boot/keys" \
            "${SEC_SDK_DIR:-/nonexistent}/u-boot/keys" || true
