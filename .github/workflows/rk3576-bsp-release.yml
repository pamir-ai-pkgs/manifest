name: Verify DVT publisher without publication
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rk3576-bsp-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, linux, x64, rk3576, bsp]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Verify released rc.2 artifacts and pinned publisher
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAMIR_GITHUB_TOKEN }}
          GOPRIVATE: github.com/Pamir-AI/*,github.com/pamir-ai-pkgs/*
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.https://github.com.helper
          GIT_CONFIG_VALUE_1: '!gh auth git-credential'
        run: |
          export PATH="$PATH:/usr/sbin:/sbin"
          python3 ci/test-ota-publish.py
          python3 ci/ota-publish.py --tag rk3576-v0.2.0-rc.2 --build-id 37172720465-2 --channel dev --verify-only
